- name: twomass_nonmatches_astro_photo
  "@id": "#twomass_nonmatches_astro_photo"
  description: Objects in 2MASS with no counterpart in the Gaia DR3 catalogue, with derived columns such as match probability and simulated flux contamination.
  columns:
  - name: twomass_name
    "@id": "#twomass_nonmatches_astro_photo.twomass_name"
    datatype: string
    description: The object identifier from the 2MASS catalogue, either the PSC or the XSC.
    length: 32
    mysql:datatype: VARCHAR(32)
  - name: twomass_ra
    "@id": "#twomass_nonmatches_astro_photo.twomass_ra"
    datatype: double
    description: Right Ascension of the object as quoted by the 2MASS catalogue.
    mysql:datatype: DOUBLE
  - name: twomass_dec
    "@id": "#twomass_nonmatches_astro_photo.twomass_dec"
    datatype: double
    description: 2MASS Declination.
    mysql:datatype: DOUBLE
  - name: j
    "@id": "#twomass_nonmatches_astro_photo.j"
    datatype: double
    description: J magnitude from 2MASS.
    mysql:datatype: DOUBLE
  - name: h
    "@id": "#twomass_nonmatches_astro_photo.h"
    datatype: double
    description: H magnitude from 2MASS.
    mysql:datatype: DOUBLE
  - name: k
    "@id": "#twomass_nonmatches_astro_photo.k"
    datatype: double
    description: K magnitude from 2MASS.
    mysql:datatype: DOUBLE
  - name: twomass_key
    "@id": "#twomass_nonmatches_astro_photo.twomass_key"
    datatype: long
    description: The pts_key column from the 2MASS PSC catalogue, or minus the ext_key column from the 2MASS XSC catalogue.
    mysql:datatype: BIGINT
  - name: match_p
    "@id": "#twomass_nonmatches_astro_photo.match_p"
    datatype: double
    description: Overall probability that the 2MASS source does not have a corresponding Gaia DR3 detection, as given by equation 26 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: nnm_separation
    "@id": "#twomass_nonmatches_astro_photo.nnm_separation"
    datatype: double
    description: On-sky distance to the nearest non-matched Gaia object, in arcseconds
    mysql:datatype: DOUBLE
  - name: nnm_eta
    "@id": "#twomass_nonmatches_astro_photo.nnm_eta"
    datatype: double
    description: Photometric logarithmic likelihood ratio of the 2MASS object and the nearest non-matched Gaia source, as described by equation 37 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: nnm_xi
    "@id": "#twomass_nonmatches_astro_photo.nnm_xi"
    datatype: double
    description: Astrometric logarithmic likelihood ratio of the 2MASS object and the nearest non-matched Gaia source, as described by equation 38 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: twomass_avg_cont
    "@id": "#twomass_nonmatches_astro_photo.twomass_avg_cont"
    datatype: double
    description: Mean contaminating relative flux within simulated 2MASS PSFs perturbation component of the Astrometric Uncertainty Function at the local density and magnitude of the source
    mysql:datatype: DOUBLE
  - name: chunkId
    "@id": "#twomass_nonmatches_astro_photo.chunkId"
    datatype: int
    description: chunkId
    mysql:datatype: INT
  - name: subChunkId
    "@id": "#twomass_nonmatches_astro_photo.subChunkId"
    datatype: int
    description: subChunkId
    mysql:datatype: INT
