- name: gaia_nonmatches_astro_photo
  "@id": "#gaia_nonmatches_astro_photo"
  description: Objects in Gaia DR3 with no counterpart in the 2MASS catalogue, with derived columns such as match probability and simulated flux contamination.
  columns:
  - name: gaia_source_id
    "@id": "#gaia_nonmatches_astro_photo.gaia_source_id"
    datatype: long
    description: The Gaia DR3 source ID.
    mysql:datatype: BIGINT
  - name: gaia_designation
    "@id": "#gaia_nonmatches_astro_photo.gaia_designation"
    datatype: string
    description: The Gaia DR3 object designation.
    length: 32
    mysql:datatype: VARCHAR(32)
  - name: gaia_ra
    "@id": "#gaia_nonmatches_astro_photo.gaia_ra"
    datatype: double
    description: Right Ascension of the Gaia DR3 source.
    mysql:datatype: DOUBLE
  - name: gaia_dec
    "@id": "#gaia_nonmatches_astro_photo.gaia_dec"
    datatype: double
    description: The Gaia DR3 declination.
    mysql:datatype: DOUBLE
  - name: bp
    "@id": "#gaia_nonmatches_astro_photo.bp"
    datatype: float
    description: The BP magnitude, from Gaia DR3.
    mysql:datatype: FLOAT
  - name: g
    "@id": "#gaia_nonmatches_astro_photo.g"
    datatype: float
    description: The G magnitude, from Gaia DR3.
    mysql:datatype: FLOAT
  - name: rp
    "@id": "#gaia_nonmatches_astro_photo.rp"
    datatype: float
    description: The RP magnitude, from Gaia DR3.
    mysql:datatype: FLOAT
  - name: match_p
    "@id": "#gaia_nonmatches_astro_photo.match_p"
    datatype: double
    description: Overall probability that the Gaia DR3 source does not have a corresponding 2MASS detection, as given by equation 26 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: nnm_separation
    "@id": "#gaia_nonmatches_astro_photo.nnm_separation"
    datatype: double
    description: On-sky distance to the nearest non-matched 2MASS object, in arcseconds.
    mysql:datatype: DOUBLE
  - name: nnm_eta
    "@id": "#gaia_nonmatches_astro_photo.nnm_eta"
    datatype: double
    description: Photometric logarithmic likelihood ratio of the Gaia DR3 object and the nearest non-matched 2MASS source, as described by equation 37 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: nnm_xi
    "@id": "#gaia_nonmatches_astro_photo.nnm_xi"
    datatype: double
    description: Astrometric logarithmic likelihood ratio of the Gaia DR3 object and the nearest non-matched 2MASS source, as described by equation 38 of Wilson & Naylor (2018a)
    mysql:datatype: DOUBLE
  - name: gaia_avg_cont
    "@id": "#gaia_nonmatches_astro_photo.gaia_avg_cont"
    datatype: double
    description: Mean contaminating relative flux within simulated Gaia PSFs perturbation component of the Astrometric Uncertainty Function at the local density and magnitude of the source.
    mysql:datatype: DOUBLE
  - name: chunkId
    "@id": "#gaia_nonmatches_astro_photo.chunkId"
    datatype: int
    description: chunkId
    mysql:datatype: INT
  - name: subChunkId
    "@id": "#gaia_nonmatches_astro_photo.subChunkId"
    datatype: int
    description: subChunkId
    mysql:datatype: INT
