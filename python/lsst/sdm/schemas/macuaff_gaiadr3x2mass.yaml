- name: matches_astro_only
  "@id": "#matches_astro_only"
  description: Counterpart associations between Gaia and 2MASS PSC, as well as derived values from the cross-match process such as match probability and contamination flux
  columns:
  - name: gaia_source_id
    "@id": "#matches_astro_only.gaia_source_id"
    datatype: long
    description: The Gaia DR3 source ID
    mysql:datatype: BIGINT
  - name: gaia_designation
    "@id": "#matches_astro_only.gaia_designation"
    datatype: string
    description: The Gaia DR3 object designation.
    length: 32
    mysql:datatype: VARCHAR(32)
  - name: gaia_ra
    "@id": "#matches_astro_only.gaia_ra"
    datatype: double
    description: Right Ascension of the Gaia DR3 source.
    mysql:datatype: DOUBLE
  - name: gaia_dec
    "@id": "#matches_astro_only.gaia_dec"
    datatype: double
    description: The Gaia DR3 declination.
    mysql:datatype: DOUBLE
  - name: bp
    "@id": "#matches_astro_only.bp"
    datatype: float
    description: The BP magnitude, from Gaia DR3.
    mysql:datatype: FLOAT
  - name: g
    "@id": "#matches_astro_only.g"
    datatype: float
    description: The Gaia DR3 G magnitude.
    mysql:datatype: FLOAT
  - name: rp
    "@id": "#matches_astro_only.rp"
    datatype: float
    description: The Gaia DR3 RP magnitude.
    mysql:datatype: FLOAT
  - name: twomass_name
    "@id": "#matches_astro_only.twomass_name"
    datatype: string
    description: The object identifier from the 2MASS catalogue, both the PSC and the XSC.
    length: 32
    mysql:datatype: VARCHAR(32)
  - name: twomass_ra
    "@id": "#matches_astro_only.twomass_ra"
    datatype: double
    description: Right Ascension of the object as quoted by the 2MASS catalogue.
    mysql:datatype: DOUBLE
  - name: twomass_dec
    "@id": "#matches_astro_only.twomass_dec"
    datatype: double
    description: 2MASS Declination.
    mysql:datatype: DOUBLE
  - name: j
    "@id": "#matches_astro_only.j"
    datatype: float
    description: J magnitude from 2MASS.
    mysql:datatype: FLOAT
  - name: h
    "@id": "#matches_astro_only.h"
    datatype: float
    description: H magnitude from 2MASS.
    mysql:datatype: FLOAT
  - name: k
    "@id": "#matches_astro_only.k"
    datatype: float
    description: K magnitude from 2MASS.
    mysql:datatype: FLOAT
  - name: twomass_key
    "@id": "#matches_astro_only.twomass_key"
    datatype: long
    description: The pts_key column from the 2MASS PSC catalogue, or minus the ext_key column from the 2MASS XSC catalogue.
    mysql:datatype: BIGINT
  - name: match_p
    "@id": "#matches_astro_only.match_p"
    datatype: double
    description: Overall probability that the Gaia DR3 and 2MASS sources are detections of the same object, as given by equation 26 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: separation
    "@id": "#matches_astro_only.separation"
    datatype: double
    description: On-sky distance between the two detections, in arcseconds.
