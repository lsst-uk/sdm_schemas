---
name: macauff_gaiadr3x2mass
"@id": "#macauff_gaiadr3x2mass"
description: Match and non-match table for macauff cross-matches of Gaia DR3 and 2MASS. Run Dec 2025
tables:
- name: matches_astro_photo
  "@id": "#matches_astro_photo"
  description: Counterpart associations between Gaia and 2MASS PSC, as well as derived values from the cross-match process such as match probability and contamination flux
  columns:
  - name: gaia_source_id
    "@id": "#matches_astro_photo.gaia_source_id"
    datatype: long
    description: The Gaia DR3 source ID
    mysql:datatype: BIGINT
  - name: gaia_designation
    "@id": "#matches_astro_photo.gaia_designation"
    datatype: string
    description: The Gaia DR3 object designation.
    length: 32
    mysql:datatype: VARCHAR(32)
  - name: gaia_ra
    "@id": "#matches_astro_photo.gaia_ra"
    datatype: double
    description: Right Ascension of the Gaia DR3 source.
    mysql:datatype: DOUBLE
  - name: gaia_dec
    "@id": "#matches_astro_photo.gaia_dec"
    datatype: double
    description: The Gaia DR3 declination.
    mysql:datatype: DOUBLE
  - name: bp
    "@id": "#matches_astro_photo.bp"
    datatype: float
    description: The BP magnitude, from Gaia DR3.
    mysql:datatype: FLOAT
  - name: g
    "@id": "#matches_astro_photo.g"
    datatype: float
    description: The Gaia DR3 G magnitude.
    mysql:datatype: FLOAT
  - name: rp
    "@id": "#matches_astro_photo.rp"
    datatype: float
    description: The Gaia DR3 RP magnitude.
    mysql:datatype: FLOAT
  - name: twomass_name
    "@id": "#matches_astro_photo.twomass_name"
    datatype: string
    description: The object identifier from the 2MASS catalogue, both the PSC and the XSC.
    length: 32
    mysql:datatype: VARCHAR(32)
  - name: twomass_ra
    "@id": "#matches_astro_photo.twomass_ra"
    datatype: double
    description: Right Ascension of the object as quoted by the 2MASS catalogue.
    mysql:datatype: DOUBLE
  - name: twomass_dec
    "@id": "#matches_astro_photo.twomass_dec"
    datatype: double
    description: 2MASS Declination.
    mysql:datatype: DOUBLE
  - name: j
    "@id": "#matches_astro_photo.j"
    datatype: float
    description: J magnitude from 2MASS.
    mysql:datatype: FLOAT
  - name: h
    "@id": "#matches_astro_photo.h"
    datatype: float
    description: H magnitude from 2MASS.
    mysql:datatype: FLOAT
  - name: k
    "@id": "#matches_astro_photo.k"
    datatype: float
    description: K magnitude from 2MASS.
    mysql:datatype: FLOAT
  - name: twomass_key
    "@id": "#matches_astro_photo.twomass_key"
    datatype: long
    description: The pts_key column from the 2MASS PSC catalogue, or minus the ext_key column from the 2MASS XSC catalogue.
    mysql:datatype: BIGINT
  - name: match_p
    "@id": "#matches_astro_photo.match_p"
    datatype: double
    description: Overall probability that the Gaia DR3 and 2MASS sources are detections of the same object, as given by equation 26 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: separation
    "@id": "#matches_astro_photo.separation"
    datatype: double
    description: On-sky distance between the two detections, in arcseconds.
    mysql:datatype: DOUBLE
  - name: eta
    "@id": "#matches_astro_photo.eta"
    datatype: double
    description: Photometric logarithmic likelihood ratio of Gaia DR3-2MASS match, as described by equation 37 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: xi
    "@id": "#matches_astro_photo.xi"
    datatype: double
    description: Astrometric logarithmic likelihood ratio of Gaia DR3-2MASS match, as described by equation 38 of Wilson & Naylor (2018a)
    mysql:datatype: DOUBLE
  - name: gaia_avg_cont
    "@id": "#matches_astro_photo.gaia_avg_cont"
    datatype: double
    description: Mean contaminating relative flux within simulated Gaia PSFs perturbation component of the Astrometric Uncertainty Function at the local density and magnitude of the source.
    mysql:datatype: DOUBLE
  - name: twomass_avg_cont
    "@id": "#matches_astro_photo.twomass_avg_cont"
    datatype: double
    description: Mean contaminating relative flux within simulated 2MASS PSFs perturbation component of the Astrometric Uncertainty Function at the local density and magnitude of the source.
    mysql:datatype: DOUBLE
  - name: gaia_cont_f1
    "@id": "#matches_astro_photo.gaia_cont_f1"
    datatype: double
    description: Probability of Gaia source having contaminant of at least 1% relative flux given its separation from its corresponding Gaia detection, as given by equation 12 of Wilson & Naylor (2018b).
    mysql:datatype: DOUBLE
  - name: gaia_cont_f10
    "@id": "#matches_astro_photo.gaia_cont_f10"
    datatype: double
    description: Probability of Gaia source having contaminant of at least 10% relative flux given its separation from its corresponding Gaia detection, as given by equation 12 of Wilson & Naylor (2018b).
    mysql:datatype: DOUBLE
  - name: twomass_cont_f1
    "@id": "#matches_astro_photo.twomass_cont_f1"
    datatype: double
    description: Probability of 2MASS source having contaminant of at least 1% relative flux given its separation from its corresponding Gaia detection, as given by equation 12 of Wilson & Naylor (2018b).
    mysql:datatype: DOUBLE
  - name: twomass_cont_f10
    "@id": "#matches_astro_photo.twomass_cont_f10"
    datatype: double
    description: Probability of 2MASS source having contaminant of at least 10% relative flux given its separation from its corresponding Gaia detection, as given by equation 12 of Wilson & Naylor (2018b).
    mysql:datatype: DOUBLE
