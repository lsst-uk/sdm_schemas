- name: catwise_nonmatches_astro_only
  '@id': '#catwise_nonmatches_astro_only'
  description: Objects in CatWISE2020 with no counterpart in the Gaia DR3 catalogue,
    with derived columns such as match probability and simulated flux contamination.
  columns:
  - name: catwise_name
    '@id': '#catwise_nonmatches_astro_only.catwise_name'
    datatype: string
    description: The object identifier from the CatWISE 2020 catalogue.
    length: 21
    mysql:datatype: VARCHAR(21)
    votable:arraysize: 21
  - name: catwise_ra
    '@id': '#catwise_nonmatches_astro_only.catwise_ra'
    datatype: double
    description: Right Ascension of the object as quoted by the CatWISE 2020 catalogue.
    mysql:datatype: DOUBLE
  - name: catwise_dec
    '@id': '#catwise_nonmatches_astro_only.catwise_dec'
    datatype: double
    description: CatWISE 2020 Declination.
    mysql:datatype: DOUBLE
  - name: w1
    '@id': '#catwise_nonmatches_astro_only.w1'
    datatype: double
    description: W1 magnitude from CatWISE 2020.
    mysql:datatype: DOUBLE
  - name: w2
    '@id': '#catwise_nonmatches_astro_only.w2'
    datatype: double
    description: W2 magnitude from CatWISE 2020.
    mysql:datatype: DOUBLE
  - name: match_p
    '@id': '#catwise_nonmatches_astro_only.match_p'
    datatype: double
    description: Overall probability that the CatWISE source does not have a corresponding Gaia DR3 detection, as given by equation 26 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: nnm_separation
    '@id': '#catwise_nonmatches_astro_only.nnm_separation'
    datatype: double
    description: On-sky distance to the nearest non-matched source from the other
      catalogue, in arcseconds.
    mysql:datatype: DOUBLE
  - name: nnm_eta
    '@id': '#catwise_nonmatches_astro_only.nnm_eta'
    datatype: double
    description: Photometric logarithmic likelihood ratio with the nearest non-matched
      source from the other catalogue, as described by equation 37 of Wilson & Naylor
      (2018a).
    mysql:datatype: DOUBLE
  - name: nnm_xi
    '@id': '#catwise_nonmatches_astro_only.nnm_xi'
    datatype: double
    description: Astrometric logarithmic likelihood ratio with the nearest non-matched
      source from the other catalogue, as described by equation 38 of Wilson & Naylor
      (2018a).
    mysql:datatype: DOUBLE
  - name: catwise_avg_cont
    '@id': '#catwise_nonmatches_astro_only.catwise_avg_cont'
    datatype: double
    description: Mean contaminating relative flux within simulated CatWISE PSFs perturbation
      component of the Astrometric Uncertainty Function at the local density and magnitude
      of the source.
    mysql:datatype: DOUBLE
  - name: catwise_fit_sig
    '@id': '#catwise_nonmatches_astro_only.catwise_fit_sig'
    datatype: double
    description: Re-derived CatWISE astrometric uncertainty, based on ensemble neighbour
      separations as a function of magnitude and quoted astrometric precision.
    mysql:datatype: DOUBLE
  - name: cntr
    '@id': '#catwise_nonmatches_astro_only.cntr'
    datatype: int
    description: integer ID from WFAU archives
    mysql:datatype: INT
  - name: chunkId
    '@id': '#catwise_nonmatches_astro_only.chunkId'
    datatype: int
    description: chunkId
    mysql:datatype: INT
  - name: subChunkId
    '@id': '#catwise_nonmatches_astro_only.subChunkId'
    datatype: int
    description: subChunkId
    mysql:datatype: INT
- name: ngpv7_gaiaids
  '@id': '#ngpv7_gaiaids'
  description: list of IDs for verification tests
  columns:
  - name: source_id
    '@id': '#ngpv7_gaiaids.source_id'
    datatype: long
    description: source_id
    mysql:datatype: BIGINT
- name: as1_gaiaids
  '@id': '#as1_gaiaids'
  description: as1 list of IDs for verification tests
  columns:
  - name: source_id
    '@id': '#as1_gaiaids.source_id'
    datatype: long
    description: source_id
    mysql:datatype: BIGINT