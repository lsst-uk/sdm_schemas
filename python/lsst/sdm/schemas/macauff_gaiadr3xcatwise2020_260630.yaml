name: macauff_gaiadr3xcatwise
'@id': '#macauff_gaiadr3xcatwise'
description: Match and non-match table for macauff cross-matches of Gaia DR3 and CatWISE
  2020. Run mid 2025
tables:
- name: matches_astro_photo
  '@id': '#matches_astro_photo'
  description: Counterpart associations between Gaia and WISE, as well as derived
    values from the cross-match process such as match probability and contamination
    flux
  columns:
  - name: gaia_source_id
    '@id': '#matches_astro_photo.gaia_source_id'
    datatype: long
    description: The Gaia DR3 object ID.
    mysql:datatype: BIGINT
  - name: gaia_ra
    '@id': '#matches_astro_photo.gaia_ra'
    datatype: double
    description: Right Ascension of the Gaia DR3 source.
    mysql:datatype: DOUBLE
  - name: gaia_dec
    '@id': '#matches_astro_photo.gaia_dec'
    datatype: double
    description: The Gaia DR3 declination.
    mysql:datatype: DOUBLE
  - name: bp
    '@id': '#matches_astro_photo.bp'
    datatype: float
    description: The BP magnitude, from Gaia DR3.
    mysql:datatype: FLOAT
  - name: g
    '@id': '#matches_astro_photo.g'
    datatype: float
    description: The Gaia DR3 G magnitude.
    mysql:datatype: FLOAT
  - name: rp
    '@id': '#matches_astro_photo.rp'
    datatype: float
    description: The Gaia DR3 RP magnitude.
    mysql:datatype: FLOAT
  - name: catwise_name
    '@id': '#matches_astro_photo.catwise_name'
    datatype: string
    description: The object identifier from the CatWISE 2020 catalogue.
    length: 21
    mysql:datatype: VARCHAR(21)
    votable:arraysize: 21
  - name: catwise_ra
    '@id': '#matches_astro_photo.catwise_ra'
    datatype: double
    description: Right Ascension of the object as quoted by the CatWISE 2020 catalogue.
    mysql:datatype: DOUBLE
  - name: catwise_dec
    '@id': '#matches_astro_photo.catwise_dec'
    datatype: double
    description: CatWISE 2020 Declination.
    mysql:datatype: DOUBLE
  - name: w1
    '@id': '#matches_astro_photo.w1'
    datatype: float
    description: W1 magnitude from CatWISE 2020.
    mysql:datatype: FLOAT
  - name: w2
    '@id': '#matches_astro_photo.w2'
    datatype: float
    description: W2 magnitude from CatWISE 2020.
    mysql:datatype: FLOAT
  - name: match_p
    '@id': '#matches_astro_photo.match_p'
    datatype: double
    description: Overall probability that the Gaia DR3 and CatWISE sources are detections of the same object, as given by equation 26 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: separation
    '@id': '#matches_astro_photo.separation'
    datatype: double
    description: On-sky distance between the two detections, in arcseconds.
    mysql:datatype: DOUBLE
  - name: eta
    '@id': '#matches_astro_photo.eta'
    datatype: double
    description: Photometric logarithmic likelihood ratio of Gaia DR3-CatWISE match, as described by equation 37 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: xi
    '@id': '#matches_astro_photo.xi'
    datatype: double
    description: Astrometric logarithmic likelihood ratio of Gaia DR3-CatWISE match, as described by equation 38 of Wilson & Naylor (2018a).
    mysql:datatype: DOUBLE
  - name: gaia_avg_cont
    '@id': '#matches_astro_photo.gaia_avg_cont'
    datatype: double
    description: Mean contaminating relative flux within simulated Gaia PSFs perturbation
      component of the Astrometric Uncertainty Function at the local density and magnitude
      of the source.
    mysql:datatype: DOUBLE
  - name: catwise_avg_cont
    '@id': '#matches_astro_photo.catwise_avg_cont'
    datatype: double
    description: Mean contaminating relative flux within simulated CatWISE PSFs perturbation
      component of the Astrometric Uncertainty Function at the local density and magnitude
      of the source.
    mysql:datatype: DOUBLE
  - name: gaia_cont_f1
    '@id': '#matches_astro_photo.gaia_cont_f1'
    datatype: double
    description: Probability of Gaia source having contaminant of at least 1% relative
      flux given its separation from its corresponding Gaia detection, as given by
      equation 12 of Wilson & Naylor (2018b).
    mysql:datatype: DOUBLE
  - name: gaia_cont_f10
    '@id': '#matches_astro_photo.gaia_cont_f10'
    datatype: double
    description: Probability of Gaia source having contaminant of at least 10% relative
      flux given its separation from its corresponding Gaia detection, as given by
      equation 12 of Wilson & Naylor (2018b).
    mysql:datatype: DOUBLE
  - name: catwise_cont_f1
    '@id': '#matches_astro_photo.catwise_cont_f1'
    datatype: double
    description: Probability of CatWISE source having contaminant of at least 1% relative
      flux given its separation from its corresponding Gaia detection, as given by
      equation 12 of Wilson & Naylor (2018b).
    mysql:datatype: DOUBLE
  - name: catwise_cont_f10
    '@id': '#matches_astro_photo.catwise_cont_f10'
    datatype: double
    description: Probability of CatWISE source having contaminant of at least 10%
      relative flux given its separation from its corresponding Gaia detection, as
      given by equation 12 of Wilson & Naylor (2018b).
    mysql:datatype: DOUBLE
  - name: gaia_orig_ra
    '@id': '#matches_astro_photo.gaia_orig_ra'
    datatype: double
    description: Original Gaia RA, before proper motion was applied to gaia_ra to
      match the CatWISE2020 epoch.
    mysql:datatype: DOUBLE
  - name: gaia_orig_dec
    '@id': '#matches_astro_photo.gaia_orig_dec'
    datatype: double
    description: Original Gaia declination, before proper motion was applied to gaia_dec
      to match the CatWISE2020 epoch.
    mysql:datatype: DOUBLE
  - name: catwise_fit_sig
    '@id': '#matches_astro_photo.catwise_fit_sig'
    datatype: double
    description: Re-derived CatWISE astrometric uncertainty, based on ensemble neighbour
      separations as a function of magnitude and quoted astrometric precision.
    mysql:datatype: DOUBLE
  - name: solution_id
    '@id': '#matches_astro_photo.solution_id'
    datatype: long
    description: solution_id
    mysql:datatype: BIGINT
  - name: designation
